name: validate

# CI never logs in to Beli. It validates the spec, typechecks, and runs the
# offline test suite. The live tests (tests/*.live.spec.ts) skip automatically
# when BELI_EMAIL is unset, which is always the case here since no credentials
# are stored in this repository. Run them locally instead:
#
#   cd validation && BELI_EMAIL=... BELI_PASSWORD=... AFFECTED_OPS=ALL npx vitest run

on:
  push:
    branches: [main]
    paths: ["openapi/**", "validation/**", "sdks/**", "scripts/**", "package.json"]
  pull_request:
    paths: ["openapi/**", "validation/**", "sdks/**", "scripts/**", "package.json"]
  workflow_dispatch: {}

permissions: { contents: read }

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install root tooling deps
        run: npm install

      - name: Validate the OpenAPI spec
        run: npm run validate:spec

      - name: Install validation deps
        run: cd validation && npm install

      - name: Typecheck
        run: cd validation && npx tsc --noEmit

      - name: Run tests (live suites skip without credentials)
        run: cd validation && npx vitest run
