openapi: 3.1.0
info:
  title: Beli API (Unofficial)
  version: 0.1.0
  description: >
    Unofficial, community-maintained. Not affiliated with, endorsed by, or supported by Beli.
    Reverse-engineered from observed traffic; may break without notice. Use your own account
    credentials at your own risk.
  license: { name: MIT }
servers:
  - { url: "https://backoffice-service-t57o3dxfca-nn.a.run.app", description: API }
  - { url: "https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app", description: ONBOARD }
  - { url: "https://backoffice-service-recs-t57o3dxfca-nn.a.run.app", description: RECS }
  - { url: "https://activity-service-978733420956.northamerica-northeast1.run.app", description: ACTIVITY }
tags:
  - { name: auth }
  - { name: profile }
  - { name: search }
  - { name: business }
  - { name: social }
  - { name: ranking }
  - { name: feed }
  - { name: lists }
  - { name: notifications }
  - { name: reservations }
  - { name: payments }
  - { name: telemetry }
paths:
  /api/token/:
    post:
      operationId: login
      tags: [auth]
      servers: [{ url: "https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app" }]
      security: []
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      summary: Login (email or phone + password) — SimpleJWT
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { description: invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/token/refresh/:
    post:
      operationId: refreshToken
      tags: [auth]
      servers: [{ url: "https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app" }]
      security: []
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      summary: Refresh an access token — refresh token itself is not rotated
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AccessToken" } } } }
  /api/user/logged-in/:
    get:
      operationId: getLoggedIn
      tags: [auth]
      servers: [{ url: "https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app" }]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      summary: Current user's full profile (incl. email, phone_no, home_city, referrer, sessions)
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/user/u/{uuid}/:
    put:
      operationId: updateUser
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Session heartbeat — sync FCM/live-activity tokens & session info; returns full user object
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token: { type: [string, "null"] }
                live_activity_token: { type: [string, "null"] }
                sessions: {}
                last_login: { type: [string, "null"], format: date-time }
                version: { type: [string, "null"] }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/device/{deviceId}/:
    put:
      operationId: updateDevice
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Update device attribution record (AppsFlyer); request body not captured
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Body not captured in reference traffic (AppsFlyer attribution fields).
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/app-rank/{uuid}/:
    get:
      operationId: getAppRank
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: App-wide rank for a user
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/check-user-settings/:
    get:
      operationId: getCheckUserSettings
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Check user settings status
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/count-ranked-this-year/{uuid}/:
    get:
      operationId: getCountRankedThisYear
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Count of places ranked by the user this year
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/creator-subscribe/:
    get:
      operationId: getCreatorSubscribe
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Creator-subscribe status/config
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/datauserinteger/:
    get:
      operationId: getDatauserinteger
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: EAV integer-valued user fields (generic field layer, see reference §4)
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/glassfy-config/:
    get:
      operationId: getGlassfyConfig
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Glassfy (in-app-purchase) config
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/has-contacts/{uuid}/:
    get:
      operationId: getHasContacts
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Whether the user has synced device contacts
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/invites-feature-progress/{uuid}/:
    get:
      operationId: getInvitesFeatureProgress
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Invites feature progress for the user
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/invites-remaining/{uuid}/:
    get:
      operationId: getInvitesRemaining
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Remaining invites for the user
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/number-params-before-user/:
    get:
      operationId: getNumberParamsBeforeUser
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: EAV numeric field definitions available before user context (see reference §4)
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/number-params/{uuid}/:
    get:
      operationId: getNumberParams
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: EAV numeric field values for a user (see reference §4)
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/profile-progress/{uuid}/:
    get:
      operationId: getProfileProgress
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Onboarding/profile-completion progress for a user
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/sharesheet-config/:
    get:
      operationId: getSharesheetConfig
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Native share-sheet config
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/taste-profile-config/{uuid}/:
    get:
      operationId: getTasteProfileConfig
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Taste-profile config for a user
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/text-params-before-user/:
    get:
      operationId: getTextParamsBeforeUser
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: EAV text field definitions available before user context (see reference §4)
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/text-params/{uuid}/:
    get:
      operationId: getTextParams
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: EAV text field values for a user (see reference §4)
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/trigger/:
    get:
      operationId: getTrigger
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: In-app nudge/trigger config
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/user-setting/:
    post:
      operationId: createUserSetting
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Write a user setting (EAV write) — `POST {user, field_name, value}`
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user: { type: string, format: uuid }
                field_name: { type: string }
                value: {}
              required: [user, field_name, value]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/UserSetting" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
    get:
      operationId: getUserSetting
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Read user settings (EAV read)
      parameters:
        - { $ref: "#/components/parameters/OriginHeader" }
        - { name: user, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/user/bio/:
    get:
      operationId: getUserBio
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: A user's bio text
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/user/member/:
    get:
      operationId: getUserMember
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: Membership/account info for a user
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResultsEnvelope" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
  /api/user/streak/:
    get:
      operationId: getUserStreak
      tags: [profile]
      security: [{ bearerAuth: [] }]
      summary: A user's ranking streak
      parameters: [{ $ref: "#/components/parameters/OriginHeader" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorDetail" } } } }
components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        username: { type: string }
        created_dt: { type: string, format: date-time }
        instagram_url: { type: [string, "null"] }
        tiktok_url: { type: [string, "null"] }
        photo: { type: [string, "null"] }
        profile_photo: { type: [string, "null"] }
        public: { type: boolean }
        school: { type: [string, "null"] }
        company: { type: [string, "null"] }
        has_supper_club: { type: boolean }
        has_vip: { type: boolean }
        is_playlist_eligible: { type: boolean }
      required: [id, username]
    UserExtended:
      description: >
        Extended profile shape returned by self/detail endpoints (adds
        contact + onboarding fields on top of the base User shape).
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            phone_no: { type: [string, "null"] }
            email: { type: [string, "null"] }
            home_city: { type: [string, "null"] }
            bio: { type: [string, "null"] }
            referrer: {}
            referral_link: { type: [string, "null"] }
            sessions: {}
            reservation_priority: {}
            qr_code: { type: [string, "null"] }
            following:
              type: [boolean, "null"]
              description: Present (bool) only in search-result contexts.
    Business:
      type: object
      properties:
        id: { type: integer }
        place_id: { type: [string, "null"] }
        name: { type: string }
        status: { type: string }
        city: { type: [string, "null"] }
        borough: { type: [string, "null"] }
        lat: { type: number }
        lng: { type: number }
        price: { type: [integer, "null"] }
        price_key: { type: [string, "null"] }
        neighborhood: { type: [string, "null"] }
        country: { type: [string, "null"] }
        website: { type: [string, "null"] }
        phone_number: { type: [string, "null"] }
        cuisines: { type: array, items: { type: string } }
        default_category: { type: [string, "null"] }
        quick_link: { type: [string, "null"] }
        tz: { type: [string, "null"] }
        has_cover_photo: { type: boolean }
        has_res_links: { type: boolean }
        has_delivery_links: { type: boolean }
        has_no_show_fee: { type: boolean }
        reservation_venue_id: { type: [integer, "null"] }
        businesshours_set: { type: array, items: { $ref: "#/components/schemas/BusinessHours" } }
        businessdistinction_set:
          type: array
          items: { type: object }
          description: Shape not pinned down by reference §8.
        businessHoursConfig:
          type: object
          description: Shape not pinned down by reference §8.
      required: [id, name]
    BusinessHours:
      type: object
      properties:
        open_day: { type: integer }
        close_day: { type: integer }
        open_time: { type: string }
        close_time: { type: string }
    Score:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        business_id: { type: integer }
        value: { type: number }
        category: { type: string }
        num_visits: { type: [integer, "null"] }
        notification_id: { type: [integer, "null"] }
        sent_dt: { type: [string, "null"], format: date-time }
    CachedScore:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        business_id: { type: integer }
        value: { type: number }
        category: { type: string }
        labels: { type: array, items: { type: string } }
    Photo:
      type: object
      properties:
        id: { type: integer }
        image: { type: string }
        thumbnail: { type: [string, "null"] }
        bb_image: { type: [string, "null"] }
        bb_thumbnail: { type: [string, "null"] }
        description: { type: [string, "null"] }
        order: { type: integer }
        favorite_dish: { type: [string, "null"] }
        created_dt: { type: string, format: date-time }
        status: { type: string }
        likes: { type: array, items: { type: string, format: uuid } }
        user: { type: string, format: uuid }
        business: { type: integer }
      required: [id]
    PublishedList:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: [string, "null"] }
        cover_photo: {}
        ranked: { type: boolean }
        category: { type: [string, "null"] }
        quick_link: { type: [string, "null"] }
        challenge_info:
          type: [object, "null"]
          properties:
            is_joined: { type: boolean }
            progress: { type: number }
            total: { type: number }
            participant_count: { type: integer }
        status: { type: string }
      required: [id, title]
    FeedItem:
      type: object
      properties:
        id: { type: integer }
        event_type: { type: string, description: "e.g. ADD, BOOKMARK, … (not exhaustively observed)" }
        sent_dt: { type: string, format: date-time }
        user1: { type: string, format: uuid }
        title: { type: [string, "null"] }
        body: { type: [string, "null"] }
        business: { type: integer }
        category: { type: [string, "null"] }
        score: { type: [number, "null"] }
        num_visits: { type: [integer, "null"] }
        business_full: { $ref: "#/components/schemas/Business" }
      required: [id]
    FollowEdge:
      type: object
      properties:
        id: { type: integer }
        request_dt: { type: [string, "null"], format: date-time }
        accept_dt: { type: [string, "null"], format: date-time }
        unfollow_dt: { type: [string, "null"], format: date-time }
        unaccept_dt: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        follower: { type: string, format: uuid }
        followed: { type: string, format: uuid }
      required: [id, status]
    ReservationOffer:
      type: object
      description: >
        Slot metadata and availability keys vary by query/platform; treat
        as a partial contract beyond the fields listed here.
      properties:
        id: { type: integer }
        user: { $ref: "#/components/schemas/User" }
        business: { $ref: "#/components/schemas/Business" }
        reservation_platforms:
          type: object
          additionalProperties:
            type: object
            properties:
              name: { type: string, enum: [OPENTABLE, SEVENROOMS] }
    Field:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        display: { type: [string, "null"] }
        table: { type: [string, "null"] }
        category: { type: [string, "null"] }
        is_filter: { type: boolean }
      required: [id, name]
    UserSetting:
      type: object
      properties:
        user: { type: string, format: uuid }
        field: { $ref: "#/components/schemas/Field" }
        value: {}
        start_dt: { type: [string, "null"], format: date-time }
        end_dt: { type: [string, "null"], format: date-time }
    TokenPair:
      type: object
      properties: { access: { type: string }, refresh: { type: string } }
      required: [access, refresh]
    AccessToken:
      type: object
      properties: { access: { type: string } }
      required: [access]
    LoginRequest:
      type: object
      properties:
        email: { type: string }
        phone_no: { type: string }
        password: { type: string }
      required: [password]
    RefreshRequest:
      type: object
      properties: { refresh: { type: string } }
      required: [refresh]
    ErrorDetail:
      type: object
      properties: { detail: { type: string }, code: { type: string } }
    ResultsEnvelope:
      type: object
      properties: { results: { type: array, items: {} } }
    PaginatedResults:
      type: object
      properties:
        count: { type: integer }
        next: { type: [string, "null"] }
        previous: { type: [string, "null"] }
        results: { type: array, items: {} }
  securitySchemes:
