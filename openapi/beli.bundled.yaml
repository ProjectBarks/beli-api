openapi: 3.1.0
info:
  title: Beli API (Unofficial)
  version: 0.1.0
  description: |
    Unofficial, community-maintained. Not affiliated with, endorsed by, or supported by Beli. Reverse-engineered from observed traffic; may break without notice. Use your own account credentials at your own risk.
  license:
    name: MIT
servers:
  - url: https://backoffice-service-t57o3dxfca-nn.a.run.app
    description: API
  - url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
    description: ONBOARD
  - url: https://backoffice-service-recs-t57o3dxfca-nn.a.run.app
    description: RECS
  - url: https://activity-service-978733420956.northamerica-northeast1.run.app
    description: ACTIVITY
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: profile
  - name: search
  - name: business
  - name: social
  - name: ranking
  - name: feed
  - name: lists
  - name: notifications
  - name: reservations
  - name: payments
  - name: telemetry
paths:
  /api/token/:
    post:
      operationId: login
      tags:
        - auth
      servers:
        - url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      summary: Login (email or phone + password) — SimpleJWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/token/refresh/:
    post:
      operationId: refreshToken
      tags:
        - auth
      servers:
        - url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      summary: Refresh an access token — refresh token itself is not rotated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          description: invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/user/logged-in/:
    get:
      operationId: getLoggedIn
      tags:
        - auth
      servers:
        - url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      summary: Current user's full profile (incl. email, phone_no, home_city, referrer, sessions)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsEnvelope'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/user/u/{uuid}/:
    put:
      operationId: updateUser
      tags:
        - auth
      security:
        - bearerAuth: []
      summary: Session heartbeat — sync FCM/live-activity tokens & session info; returns full user object
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token:
                  type:
                    - string
                    - 'null'
                live_activity_token:
                  type:
                    - string
                    - 'null'
                sessions: {}
                last_login:
                  type:
                    - string
                    - 'null'
                  format: date-time
                version:
                  type:
                    - string
                    - 'null'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/device/{deviceId}/:
    put:
      operationId: updateDevice
      tags:
