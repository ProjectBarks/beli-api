      summary: Update device attribution record (AppsFlyer); request body not captured
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Body not captured in reference traffic (AppsFlyer attribution fields).
      responses:
        '200':
          description: ok
