components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        username:
          type: string
        created_dt:
          type: string
          format: date-time
        instagram_url:
          type:
            - string
            - 'null'
        tiktok_url:
          type:
            - string
            - 'null'
        photo:
          type:
            - string
            - 'null'
        profile_photo:
          type:
            - string
            - 'null'
        public:
          type: boolean
        school:
          type:
            - string
            - 'null'
        company:
          type:
            - string
            - 'null'
        has_supper_club:
          type: boolean
        has_vip:
          type: boolean
        is_playlist_eligible:
          type: boolean
      required:
        - id
        - username
    UserExtended:
      description: |
        Extended profile shape returned by self/detail endpoints (adds contact + onboarding fields on top of the base User shape).
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            phone_no:
              type:
                - string
                - 'null'
            email:
              type:
                - string
                - 'null'
            home_city:
              type:
                - string
                - 'null'
            bio:
              type:
                - string
                - 'null'
            referrer: {}
            referral_link:
              type:
                - string
                - 'null'
            sessions: {}
            reservation_priority: {}
            qr_code:
              type:
                - string
                - 'null'
            following:
              type:
                - boolean
                - 'null'
              description: Present (bool) only in search-result contexts.
    Business:
      type: object
      properties:
        id:
          type: integer
        place_id:
          type:
            - string
            - 'null'
        name:
          type: string
        status:
          type: string
        city:
          type:
            - string
            - 'null'
        borough:
          type:
            - string
            - 'null'
        lat:
          type: number
        lng:
          type: number
        price:
          type:
            - integer
            - 'null'
        price_key:
          type:
            - string
            - 'null'
        neighborhood:
          type:
            - string
            - 'null'
        country:
          type:
            - string
            - 'null'
        website:
          type:
            - string
            - 'null'
        phone_number:
          type:
            - string
            - 'null'
        cuisines:
          type: array
          items:
            type: string
        default_category:
          type:
            - string
            - 'null'
        quick_link:
          type:
            - string
            - 'null'
        tz:
          type:
            - string
            - 'null'
        has_cover_photo:
          type: boolean
        has_res_links:
          type: boolean
        has_delivery_links:
          type: boolean
        has_no_show_fee:
          type: boolean
        reservation_venue_id:
          type:
            - integer
            - 'null'
        businesshours_set:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHours'
        businessdistinction_set:
          type: array
          items:
            type: object
          description: Shape not pinned down by reference §8.
        businessHoursConfig:
          type: object
          description: Shape not pinned down by reference §8.
      required:
        - id
        - name
    BusinessHours:
      type: object
      properties:
        open_day:
          type: integer
        close_day:
          type: integer
        open_time:
          type: string
        close_time:
          type: string
    Score:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        business_id:
          type: integer
        value:
          type: number
        category:
          type: string
        num_visits:
          type:
            - integer
            - 'null'
        notification_id:
          type:
            - integer
            - 'null'
        sent_dt:
          type:
            - string
            - 'null'
          format: date-time
    CachedScore:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        business_id:
          type: integer
        value:
          type: number
        category:
